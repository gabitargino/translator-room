services:
  stt:
    gpus: all
    environment:
      - NVIDIA_VISIBLE_DEVICES=${NVIDIA_VISIBLE_DEVICES:-all}
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
    # translator-room: keep downloaded Whisper models across container
    # recreations. The image only bakes in the model when it can be loaded at
    # build time, which is never the case on the GPU (no GPU during build).
    volumes:
      - stt_models:/root/.cache/huggingface

volumes:
  stt_models:
